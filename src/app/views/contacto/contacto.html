<div class="min-h-screen bg-stone-50 pt-20 pb-20">
  <div class="max-w-4xl mx-auto px-6">
    <h1 class="text-4xl font-black text-stone-900 mb-2">Contacto</h1>
    <p class="text-stone-600 mb-10">¿Tienes preguntas? Nos encantaría escucharte</p>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
      <!-- Contact Information -->
      <div class="lg:col-span-1 space-y-6">
        <div class="flex items-start gap-4">
          <div class="w-10 h-10 bg-amber-500 rounded-lg flex items-center justify-center flex-shrink-0 text-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.8a16 16 0 0 0 6.29 6.29l1.34-1.34a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </div>
          <div>
            <h3 class="font-semibold text-stone-900">Teléfono</h3>
            <p class="text-stone-600">+52 (272) 000-0000</p>
          </div>
        </div>

        <div class="flex items-start gap-4">
          <div class="w-10 h-10 bg-amber-500 rounded-lg flex items-center justify-center flex-shrink-0 text-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
          </div>
          <div>
            <h3 class="font-semibold text-stone-900">Email</h3>
            <p class="text-stone-600">contacto&#64;inmomx.com</p>
          </div>
        </div>

        <div class="flex items-start gap-4">
          <div class="w-10 h-10 bg-amber-500 rounded-lg flex items-center justify-center flex-shrink-0 text-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
            </svg>
          </div>
          <div>
            <h3 class="font-semibold text-stone-900">Ubicación</h3>
            <p class="text-stone-600">México</p>
          </div>
        </div>
      </div>

      <!-- Contact Form -->
      <form class="lg:col-span-2 bg-white rounded-xl p-8 shadow-sm space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-stone-900 mb-2">Nombre</label>
            <input type="text" class="w-full px-4 py-2.5 border border-stone-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500" placeholder="Tu nombre" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-stone-900 mb-2">Email</label>
            <input type="email" class="w-full px-4 py-2.5 border border-stone-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500" placeholder="tu@email.com" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-stone-900 mb-2">Asunto</label>
          <input type="text" class="w-full px-4 py-2.5 border border-stone-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500" placeholder="¿Cuál es tu consulta?" />
        </div>

        <div>
          <label class="block text-sm font-semibold text-stone-900 mb-2">Mensaje</label>
          <textarea rows="5" class="w-full px-4 py-2.5 border border-stone-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500" placeholder="Tu mensaje aquí..."></textarea>
        </div>

        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-lg transition-colors duration-200">
          Enviar Mensaje
        </button>
      </form>
    </div>
  </div>
</div>
