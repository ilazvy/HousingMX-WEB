        <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 text-white" viewBox="0 0 24 24" fill="currentColor">

     <div class="flex-1 max-w-xl">
      <div class="relative group/search">

        </span>

        <input

          placeholder="Buscar por ciudad, colonia o tipo de propiedad..."

        />

         <span class="absolute right-3 top-1/2 -translate-y-1/2 hidden sm:flex items-center gap-0.5">
          <kbd class="text-[10px] text-stone-300 bg-stone-100 border border-stone-200 rounded px-1.5 py-0.5 font-mono">⌘K</kbd>
        </span>
      </div>
    </div>

     <nav class="hidden md:flex items-center gap-1">

      <a routerLink="/propiedades" class="px-3 py-2 text-sm font-semibold text-stone-600 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition-all duration-150">Propiedades</a>

    </nav>

     <a routerLink="/contacto" class="hidden sm:flex items-center gap-1.5 bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold px-4 py-2 rounded-xl transition-colors duration-200 shadow-sm flex-shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
